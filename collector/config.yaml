# Configuração do coletor "Aysha Leilões".
# Tudo que é específico de uma fonte fica dentro de `fontes.<nome>`.

projeto:
  nome: "Aysha Leilões"
  repositorio: "https://github.com/JoseMarquesJunior/aysha-leiloes"
  user_agent: "aysha-leiloes/0.1 (+https://github.com/JoseMarquesJunior/aysha-leiloes)"

http:
  timeout_segundos: 60
  intervalo_minimo_por_dominio_segundos: 2
  tentativas: 4
  respeitar_robots: true

# UFs coletadas (vale para todas as fontes que filtram por UF).
ufs: [ES, MG, RJ, SP, GO, PE, RS, PI, BA]

# Prioridade de fontes na deduplicação: menor número = fonte principal preferida
# (banco/órgão oficial antes de leiloeiro).
prioridade_fontes:
  caixa: 0
  banestes: 0
  bandes: 0
  spu: 0
  jfes: 0
  resale: 1
  leiloeiro: 2

fontes:
  caixa:
    ativa: true
    url_lista: "https://venda-imoveis.caixa.gov.br/listaweb/Lista_imoveis_{uf}.csv"
    codificacao: latin-1
    separador: ";"
  banestes:
    # Só o índice de editais (robots.txt do Banestes proíbe PDFs); lotes vêm pelos leiloeiros.
    ativa: true
  bandes:
    # Só o índice de arquivos de venda direta; o site derruba conexões com frequência.
    ativa: true
  spu:
    # API pública do VendasGov (SPU); filtra por UF no cliente.
    ativa: true
  jfes:
    # Editais em PDF dos leilões unificados da Justiça Federal no ES.
    ativa: true
    maximo_artigos: 4
  suporteleiloes:
    # Leiloeiros do ES na plataforma Suporte Leilões (buscador por UF).
    ativa: true
    sites:
      - slug: emleilao
        url: "https://www.emleilao.com.br"
        leiloeiro: "Ayrton de Souza Porto Filho (Em Leilão, JUCEES 058/2014)"
      - slug: buaiz
        url: "https://www.buaizleiloes.com.br"
        leiloeiro: "Alexandre Buaiz Neto (Buaiz Leilões)"
      - slug: esleiloes
        url: "https://www.esleiloes.com.br"
        leiloeiro: "Sérgio de Paula Pereira (ES Leilões, JUCEES 008/1984)"
      - slug: suedpeter
        url: "https://www.suedpeterleiloes.com.br"
        leiloeiro: "Sued Peter (Sued Peter Leilões)"
  vixleiloes:
    ativa: true
  colodete:
    ativa: true
    # colodeteleiloes.com.br devolve 403 a IPs de datacenter (GitHub Actions); coletar localmente:
    #   python -m collector.main --fontes colodete
    bloqueado_no_ci: true
  hdleiloes:
    # API JSON própria (POST /core/api/get-lotes); uso por POST confirmado pelo mantenedor em 2026-10-21.
    ativa: true
  resale:
    # Desativada: os Termos de Uso (12/09/2025) proíbem scraping e mineração de dados (ver README).
    ativa: false

saida:
  pasta: docs/data
  # Acima deste tamanho, imoveis.json é dividido em imoveis_<UF>.json (carregados sob demanda pelo site).
  dividir_por_uf_acima_de_mb: 3
  # Com a base dividida, o site abre com estas UFs; as outras carregam quando selecionadas no filtro.
  ufs_carregadas_por_padrao: [ES, MG]
  # Snapshot diário guarda só o que mudou desde a coleta anterior; snapshot completo no 1º dia do mês.
  snapshot_completo_dia: 1
  # Registros que sumiram da fonte continuam no JSON (ativo=false) por este prazo.
  dias_retencao_removidos: 90
  # Snapshots diários com mais que isto são compactados num resumo mensal.
  dias_snapshots_diarios: 90
  dias_retencao_eventos: 365

geocodificacao:
  ativa: true
  url: "https://nominatim.openstreetmap.org/search"
  intervalo_segundos: 1.1
  cache: collector/cache/geo.json
  # Limite de novas consultas por execução (protege o Nominatim e o tempo do Action).
  maximo_por_execucao: 1000
  # Precisão máxima por UF: nos estados grandes (milhares de imóveis) geocodificamos só bairro + cidade,
  # que repete muito e cabe no cache; endereço completo fica para o foco do projeto (ES e MG).
  precisao_maxima_por_uf:
    RJ: bairro
    SP: bairro
    GO: bairro
    PE: bairro
    RS: bairro
    PI: bairro
    BA: bairro

# Etapa de IA (estimativa aprovada em 2026-10-21). Só roda com ANTHROPIC_API_KEY no ambiente E
# ia_habilitada: true; sem a chave, só aplica o que já está no cache e grava a estimativa.
ia:
  ia_habilitada: true
  modelo: "claude-haiku-5-5"   # o mais barato; nunca Sonnet/Opus neste projeto
  # Saída é JSON com até 7 trechos-fonte de 200 caracteres: 900 tokens cobrem com folga (pensamento desligado).
  max_tokens_saida: 900
  max_caracteres_entrada: 6000
  limite_chamadas_por_execucao: 50
  limite_custo_usd_por_execucao: 0.50
  # Lotes pequenos costumam ficar prontos em minutos; se não, o resultado entra na execução seguinte.
  esperar_lote_minutos: 10
  cache: collector/cache/ia
  # Filtro: só imóveis que atendam a tudo abaixo vão para a IA. Listas vazias = todas as UFs/cidades;
  # desconto mínimo nulo = sem corte (leilões judiciais no 1º leilão têm desconto 0 e são os que mais
  # trazem ônus na matrícula). Os tetos diários abaixo continuam valendo.
  filtro:
    ufs: []
    cidades: []
    desconto_minimo_pct: null
  campos_alto_valor: [ocupado, debitos_iptu_por_conta_de, debitos_condominio_por_conta_de, onus_na_matricula]
  palavras_chave: [ocupa, desocupa, IPTU, condomínio, condominio, débito, debito, ônus, onus, penhora, hipoteca, usufruto, indisponib, comissão, comissao, FGTS, financiamento]
