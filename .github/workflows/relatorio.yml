name: Relatório de imóvel com IA

# Gera o parecer detalhado (Opus + busca na web) de um ou mais imóveis e commita em docs/data/relatorios/.
# Disparos:
#  - manual (workflow_dispatch) com a lista de ids;
#  - abertura de issue cujo título começa com "Analisar " seguido do id (é o que o botão do site faz:
#    abre uma issue pré-preenchida; a pessoa precisa de conta no GitHub). O workflow comenta na issue
#    com o link da ficha e a fecha.
# Cada relatório é gerado uma vez: se o arquivo já existe, nada é chamado.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Ids dos imóveis, separados por espaço (ex.: caixa-8787701324906 hd-224061)"
        required: true
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: relatorios
  cancel-in-progress: false

jobs:
  relatorio:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Analisar ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ids a analisar
        id: ids
        env:
          TITULO: ${{ github.event.issue.title }}
          IDS_INPUT: ${{ inputs.ids }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            IDS=$(echo "$TITULO" | sed -E 's/^Analisar[[:space:]]+//' | tr -cd 'A-Za-z0-9._ -')
          else
            IDS="$IDS_INPUT"
          fi
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "Ids: $IDS"

      - name: Gerar relatórios
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m collector.relatorio ${{ steps.ids.outputs.ids }}

      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data/relatorios docs/data/custo_relatorios.json collector/cache/pdf
          git commit -m "relatórios: ${{ steps.ids.outputs.ids }}" || { echo "nada novo"; exit 0; }
          for tentativa in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1

      - name: Responder na issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.ids.outputs.ids }}
        run: |
          CORPO="Relatório gerado. Em alguns minutos ele aparece na ficha do imóvel:"
          for id in $IDS; do CORPO="$CORPO
          - https://josemarquesjunior.github.io/aysha-leiloes/imovel.html?id=$id#analise"; done
          gh issue comment ${{ github.event.issue.number }} --body "$CORPO"
          gh issue close ${{ github.event.issue.number }}
