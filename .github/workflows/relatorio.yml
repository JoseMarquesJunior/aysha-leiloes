name: Relatório de imóvel com IA

# Gera o parecer detalhado (Opus + busca na web) de um ou mais imóveis, extrai os campos estruturados e
# envia o texto ao Worker (banco D1), que o entrega só a quem tem acesso. No repositório ficam apenas os
# metadados e os campos (collector/cache/relatorios) e o custo acumulado.
# Disparo: workflow_dispatch com a lista de ids (é o que o Worker faz quando alguém pede uma análise)
# ou com "--migrar" para enviar ao Worker os relatórios antigos de docs/data/relatorios.
# Cada relatório é gerado uma vez: se os metadados já existem, nada é chamado.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Ids dos imóveis, separados por espaço (ex.: caixa-8787701324906 hd-224061), ou --migrar"
        required: true

permissions:
  contents: write

concurrency:
  group: relatorios
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ids a analisar
        id: ids
        env:
          IDS_INPUT: ${{ inputs.ids }}
        run: |
          IDS=$(echo "$IDS_INPUT" | tr -cd 'A-Za-z0-9._ -')
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "Ids: $IDS"

      - name: Gerar relatórios
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORKER_URL: https://aysha-leiloes-analise.aysha-leiloes-analise.workers.dev
          INTERNO_SECRET: ${{ secrets.INTERNO_SECRET }}
        run: python -m collector.relatorio ${{ steps.ids.outputs.ids }}

      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A collector/cache/relatorios docs/data/custo_relatorios.json collector/cache/pdf
          [ -d docs/data/relatorios ] && git add -A docs/data/relatorios || true
          git commit -m "relatórios: ${{ steps.ids.outputs.ids }}" || { echo "nada novo"; exit 0; }
          for tentativa in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
