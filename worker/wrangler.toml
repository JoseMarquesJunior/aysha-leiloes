name = "aysha-leiloes-analise"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
REPO = "JoseMarquesJunior/aysha-leiloes"
# Endereço público do site (links dos e-mails e retorno do checkout). Se o domínio mudar, troque aqui,
# em ORIGENS, em docs/js/config.js (urlSite) e nos <link rel="canonical"> das páginas.
SITE = "https://ayshaleiloes.com.br"
ORIGENS = "https://ayshaleiloes.com.br,https://www.ayshaleiloes.com.br,https://aysha.leiloes.workers.dev,https://josemarquesjunior.github.io,http://localhost:8791"
# Endereço público deste Worker (links de descadastro dos alertas nos e-mails do cron, que não tem request)
URL_API = "https://aysha-leiloes-analise.leiloes.workers.dev"
# e-mail que recebe os alertas do robô (custo do dia acima do teto); vazio = EMAIL_REMETENTE
ALERTA_EMAIL = ""
# contas (separadas por vírgula) que podem abrir admin.html: usuários, créditos, pedidos, relatórios
ADMIN_EMAILS = "jmarques.oliveirajunior@gmail.com"
# outras contas do mantenedor usadas só para testar o funil (SEM acesso de admin): saem das contagens
# de /interno/metricas e as compras delas contam como teste (limitação 3 do baseline)
EMAILS_TESTE = "jm_junior1234@hotmail.com"
LIMITE_DIA = "100"
# Canal de envio: "brevo" (remetente no domínio, autenticado no Brevo em 2026-10-29) ou "gmail"
# (secrets GMAIL_*). O remetente deve combinar com o canal: pelo Gmail, o From precisa ser a conta Gmail.
EMAIL_VIA = "brevo"
EMAIL_REMETENTE = "contato@ayshaleiloes.com.br"
NOME_REMETENTE = "Aysha Leilões"
# Tabela de créditos (valores em centavos). Edite e rode `npx wrangler deploy`.
PACOTES = '[{"id":"1","nome":"1 análise","creditos":1,"valor_centavos":1490},{"id":"5","nome":"5 análises","creditos":5,"valor_centavos":5900},{"id":"20","nome":"20 análises","creditos":20,"valor_centavos":19900}]'

# KV para os contadores de limite (criado por: npx wrangler kv namespace create LIMITES)
[[kv_namespaces]]
binding = "LIMITES"
id = "e90cfdcd18a64c00866feec94a4b3464"

# D1: contas, créditos, relatórios, pedidos (criado por: npx wrangler d1 create aysha-contas)
[[d1_databases]]
binding = "DB"
database_name = "aysha-contas"
database_id = "8c3f8ce1-79eb-4fbb-b20c-ba9baa160e82"

# lembretes da agenda: todo dia às 11:00 UTC (08:00 em Brasília)
[triggers]
crons = ["0 11 * * *"]
